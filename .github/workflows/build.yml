name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unpack project
        run: |
          unzip -o CVApply.zip
          unzip -o CVApply-update.zip
          cp -r upd/app/. CVApply/app/
      - run: gradle assembleDebug --no-daemon
        working-directory: CVApply
      - uses: actions/upload-artifact@v4
        with:
          name: cv-apply-apk
          path: CVApply/app/build/outputs/apk/debug/app-debug.apk
