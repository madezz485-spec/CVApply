name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: |
          mkdir src
          unzip -q CVApply.zip -d src
          echo "DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV
      - name: Build
        run: cd "$DIR" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CVApply-apk
          path: src/**/build/outputs/apk/debug/*.apk
